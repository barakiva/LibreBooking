services:

  nginx:
    image: nginx:1.27
    container_name: librebooking_nginx
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "180:80"
    networks:
      - [librebooking]
    depends_on:
      - web
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: librebooking_web
    volumes:
      - .:/var/www/html
    networks:
      - [librebooking]
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: librebooking_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: librebooking
      MYSQL_USER: libre
      MYSQL_PASSWORD: libre
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - [librebooking]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: librebooking_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - [librebooking]
    depends_on:
      db:
        condition: service_started

networks:
  librebooking:
    driver: bridge

volumes:
  db_data:
